<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc Của Oanh 🎵</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary-pink: #ff4d6d;
            --hover-pink: #ff758f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding-bottom: 100px;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- BACKGROUND TIM BAY --- */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            animation: float 15s linear infinite;
            bottom: -50px;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- FIX LỖI CHOOSE FILE & CĂN CHỈNH --- */
        input[type="file"] {
            display: none !important;
        }
        /* Ẩn tuyệt đối nút mặc định */

        .custom-file-upload {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 15px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            text-align: center;
            color: white;
            height: 45px;
            transition: 0.3s;
        }

            .custom-file-upload:hover {
                background: rgba(255, 255, 255, 0.25);
                border-color: white;
            }

        /* --- ACCORDION & CHỮ SÁNG --- */
        .accordion-item {
            background: transparent;
            border: none;
        }

        .accordion-button {
            background: rgba(255,255,255,0.1);
            color: white !important;
            border-radius: 15px !important;
        }

            .accordion-button:not(.collapsed) {
                background: rgba(255, 77, 109, 0.3);
                color: white !important;
                box-shadow: none;
            }

            .accordion-button::after {
                filter: brightness(0) invert(1);
            }

        .accordion-body h6 {
            color: var(--primary-pink) !important;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .accordion-body label {
            color: white !important;
            opacity: 1 !important;
        }

        h2, .dating-title {
            font-family: 'Dancing Script', cursive;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 3.5rem;
            margin: 40px 0;
        }

        /* --- PHÂN TRANG --- */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-page {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 15px;
            border-radius: 10px;
            transition: 0.3s;
        }

            .btn-page:hover:not(:disabled) {
                background: var(--primary-pink);
                border-color: var(--primary-pink);
            }

            .btn-page:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }

        /* --- DATING COUNTER --- */
        .dating-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .avatar {
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            border: 3px solid white;
            object-fit: cover;
        }

        .days-number {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            color: var(--primary-pink);
            line-height: 1;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: heartBeat 1.2s infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        /* --- MUSIC PLAYER --- */
        .music-player-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 50px !important;
        }

        .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-pink);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 0;
            overflow: hidden;
            transition: 0.5s;
        }

        .music-player-container:hover .volume-control {
            width: 110px;
        }

        #volumeSlider {
            width: 70px;
            accent-color: var(--primary-pink);
        }

        /* --- PREVIEW --- */
        #previewContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
        }

        .preview-item {
            position: relative;
            background: rgba(255,255,255,0.1);
            padding: 5px;
            border-radius: 10px;
            cursor: grab;
        }

            .preview-item img {
                width: 100%;
                height: 110px;
                object-fit: cover;
                border-radius: 5px;
            }

        .preview-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--primary-pink);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #444;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
            height: 45px;
        }

        .list-group-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 10px;
            border-radius: 15px !important;
            transition: 0.3s;
        }

            .list-group-item:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateX(8px);
            }

        .song-link {
            color: white;
            text-decoration: none;
            flex-grow: 1;
            font-weight: 500;
        }

        .delete-icon {
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <h2 class="text-center">🎵 Kho Nhạc Của Oanh</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="accordion mb-4" id="toolAccordion">
                    <div class="accordion-item glass-card">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTools">
                                <i class="bi bi-gear-fill me-2"></i> Công cụ quản lý nhạc
                            </button>
                        </h2>
                        <div id="collapseTools" class="accordion-collapse collapse" data-bs-parent="#toolAccordion">
                            <div class="accordion-body px-4">
                                <div class="mb-4">
                                    <h6><i class="bi bi-heart-fill me-2"></i>Thêm Giai Điệu Mới</h6>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-5"><input type="text" id="songTitle" class="form-control" placeholder="Tên bài hát..."></div>
                                        <div class="col-md-5">
                                            <label for="pdfFile" class="custom-file-upload" id="fileLabel"><i class="bi bi-file-earmark-pdf"></i> Chọn file PDF</label>
                                            <input type="file" id="pdfFile" accept=".pdf" onchange="updateFileName()">
                                        </div>
                                        <div class="col-md-2"><button class="btn btn-danger w-100 p-2 h-100" onclick="uploadSong()"><i class="bi bi-cloud-plus-fill"></i></button></div>
                                    </div>
                                </div>
                                <hr class="opacity-25">
                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h6><i class="bi bi-magic me-2"></i>Gộp Ảnh sang PDF</h6>
                                        <button class="btn btn-sm btn-reset" onclick="resetAllImages()">Reset</button>
                                    </div>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-9">
                                            <label for="imgToPdf" class="custom-file-upload" id="imgLabel"><i class="bi bi-images"></i> Chọn ảnh iPhone/Android</label>
                                            <input type="file" id="imgToPdf" accept="image/*,.heic,.HEIC" multiple onchange="handleFileSelect()">
                                        </div>
                                        <div class="col-md-3"><button id="btnConvert" class="btn btn-info w-100 p-2 text-white fw-bold" onclick="generatePDF()">Gộp Ngay</button></div>
                                    </div>
                                    <div id="previewContainer" style="display: none;"></div>
                                    <div id="pdfStatus" class="small mt-2 text-center"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-2 mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-white opacity-50"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-transparent border-0" placeholder="Tìm bài hát A-Z..." oninput="filterSongs()">
                    </div>
                </div>

                <div id="musicList" class="list-group mb-5">
                    <div class="text-center py-5"><div class="spinner-border text-light"></div></div>
                </div>

                <div class="glass-card p-5 text-center">
                    <h4 class="dating-title mb-4">Our Love Story</h4>
                    <div class="dating-container">
                        <div class="avatar-box">
                            <img src="dang.jpg" class="avatar" alt="Anh Đăng">
                            <div class="avatar-name mt-2 fw-bold">Anh Đăng</div>
                        </div>
                        <div class="counter-box">
                            <div class="heart-icon"><i class="bi bi-heart-fill"></i></div>
                            <div id="daysCount" class="days-number">0</div>
                            <div style="font-size: 0.7rem; opacity: 0.8; font-weight: 600;">NGÀY BÊN NHAU</div>
                        </div>
                        <div class="avatar-box">
                            <img src="oanh.jpg" class="avatar" alt="Bé Oanh">
                            <div class="avatar-name mt-2 fw-bold">Bé Oanh</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="music-player-container glass-card">
        <button id="playBtn" class="play-btn"><i class="bi bi-play-fill" id="playIcon"></i></button>
        <div class="volume-control">
            <i class="bi bi-volume-up-fill small text-white"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <audio id="bgMusic" loop>
            <source src="kisstherain.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        // --- CẤU HÌNH SUPABASE ---
        const _URL = 'https://vvmivjmgepmosdwkiagb.supabase.co';
        const _KEY = 'sb_publishable_f9No0YOA6vmNDJwdE_GG3w_gtKXbIcF';
        const _supabase = supabase.createClient(_URL, _KEY);
        const startDate = new Date('2024-05-21');

        let allSongs = [];
        let filteredSongs = [];
        let currentPage = 1;
        const pageSize = 10;

        // Tải danh sách
        async function loadSongs() {
            const { data, error } = await _supabase.from('song').select('*').order('ten_nhac', { ascending: true });
            if (error) return;
            allSongs = data || [];
            filteredSongs = [...allSongs];
            renderList();
        }

        // Render & Phân trang
        function renderList() {
            const list = document.getElementById('musicList');
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const items = filteredSongs.slice(start, end);

            if (filteredSongs.length === 0) {
                list.innerHTML = `<div class="text-center opacity-50 mt-5">Chưa có bài hát nào... ❤️</div>`;
                return;
            }

            let html = items.map(song => `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <a href="${song.pdf_url}" target="_blank" class="song-link"><i class="bi bi-music-note-beamed me-2 text-danger"></i> ${song.ten_nhac}</a>
                        <i class="bi bi-trash3 delete-icon" onclick="deleteSong(${song.id}, '${song.pdf_url}')"></i>
                    </div>`).join('');

            const totalPages = Math.ceil(filteredSongs.length / pageSize);
            if (totalPages > 1) {
                html += `
                    <div class="pagination-container">
                        <button class="btn-page" onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}><i class="bi bi-chevron-left"></i></button>
                        <span class="small opacity-75">Trang ${currentPage} / ${totalPages}</span>
                        <button class="btn-page" onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}><i class="bi bi-chevron-right"></i></button>
                    </div>`;
            }
            list.innerHTML = html;
        }

        function changePage(step) { currentPage += step; renderList(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            filteredSongs = allSongs.filter(s => s.ten_nhac.toLowerCase().includes(query));
            currentPage = 1;
            renderList();
        }

        // Tool Gộp PDF
        const previewContainer = document.getElementById('previewContainer');
        Sortable.create(previewContainer, { animation: 150, onEnd: updateBadges });

        function updateBadges() {
            const items = previewContainer.querySelectorAll('.preview-item');
            items.forEach((item, index) => { item.querySelector('.preview-badge').innerText = index + 1; });
            document.getElementById('imgLabel').innerHTML = `<i class="bi bi-check-all text-success"></i> Đã chọn ${items.length} ảnh`;
        }

        function handleFileSelect() {
            const input = document.getElementById('imgToPdf');
            const files = Array.from(input.files);
            if (files.length === 0) return;
            previewContainer.style.display = "grid";
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            files.forEach((file) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.fileObject = file;
                let imgSrc = "https://placehold.co/100x120?text=HEIC";
                if (!file.name.toLowerCase().endsWith(".heic")) imgSrc = URL.createObjectURL(file);
                item.innerHTML = `<div class="preview-badge">0</div><div class="remove-btn" onclick="this.parentElement.remove();updateBadges();"><i class="bi bi-x"></i></div><img src="${imgSrc}"><p style="font-size:8px; margin:5px 0 0 0; overflow:hidden; white-space:nowrap; opacity:0.7;">${file.name}</p>`;
                previewContainer.appendChild(item);
            });
            updateBadges();
            input.value = "";
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const items = Array.from(previewContainer.querySelectorAll('.preview-item'));
            if (items.length === 0) return alert('Chọn ảnh nhen Oanh!');

            const btn = document.getElementById('btnConvert');
            const status = document.getElementById('pdfStatus');
            btn.disabled = true;
            status.innerHTML = "Đang xử lý thông minh... ⏳";

            try {
                let pdf; // Khởi tạo biến PDF bên ngoài loop

                for (let i = 0; i < items.length; i++) {
                    let file = items[i].fileObject;

                    // 1. Xử lý file HEIC nếu cần
                    if (file.name.toLowerCase().endsWith(".heic")) {
                        const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.8 });
                        file = Array.isArray(blob) ? blob[0] : blob;
                    }

                    // 2. Load ảnh vào một Object Image để lấy kích thước thật
                    const imgData = await new Promise(r => {
                        const reader = new FileReader();
                        reader.onload = e => r(e.target.result);
                        reader.readAsDataURL(file);
                    });

                    const img = new Image();
                    await new Promise(r => { img.onload = r; img.src = imgData; });

                    // 3. TÍNH TOÁN HƯỚNG GIẤY (PORTRAIT HOẶC LANDSCAPE)
                    const orientation = img.width > img.height ? 'l' : 'p'; // 'l' là landscape, 'p' là portrait

                    if (i === 0) {
                        // Khởi tạo trang đầu tiên với hướng giấy của ảnh đầu tiên
                        pdf = new jsPDF({ orientation: orientation, unit: 'mm', format: 'a4' });
                    } else {
                        // Thêm trang mới với hướng giấy phù hợp với ảnh tiếp theo
                        pdf.addPage('a4', orientation);
                    }

                    // 4. TÍNH TOÁN KÍCH THƯỚC ĐỂ KHÔNG BỊ ÉP CHỮ
                    const pageWidth = pdf.internal.pageSize.getWidth();
                    const pageHeight = pdf.internal.pageSize.getHeight();

                    const imgRatio = img.width / img.height;
                    const pageRatio = pageWidth / pageHeight;

                    let finalW, finalH;

                    // Nếu ảnh béo hơn trang giấy, lấy width theo trang
                    if (imgRatio > pageRatio) {
                        finalW = pageWidth;
                        finalH = pageWidth / imgRatio;
                    } else {
                        // Nếu ảnh gầy hơn trang giấy, lấy height theo trang
                        finalH = pageHeight;
                        finalW = pageHeight * imgRatio;
                    }

                    // Căn giữa ảnh vào trang giấy
                    const x = (pageWidth - finalW) / 2;
                    const y = (pageHeight - finalH) / 2;

                    pdf.addImage(imgData, 'JPEG', x, y, finalW, finalH);
                }

                pdf.save(`Nhac_Oanh_${Date.now()}.pdf`);
                status.innerHTML = "✅ Xong rồi, đẹp lung linh!";
            } catch (e) {
                console.error(e);
                alert("Lỗi gộp file rồi Đăng ơi!");
            } finally {
                btn.disabled = false;
            }
        }

        function resetAllImages() { previewContainer.innerHTML = ""; previewContainer.style.display = "none"; document.getElementById('imgLabel').innerHTML = `<i class="bi bi-images"></i> Chọn ảnh iPhone/Android`; }

        // Nhạc nền
        const bgMusic = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        playBtn.addEventListener('click', () => {
            if (bgMusic.paused) { bgMusic.play().catch(e => console.log(e)); playIcon.className = 'bi bi-pause-fill'; playBtn.classList.add('playing'); }
            else { bgMusic.pause(); playIcon.className = 'bi bi-play-fill'; playBtn.classList.remove('playing'); }
        });
        document.getElementById('volumeSlider').addEventListener('input', (e) => { bgMusic.volume = e.target.value; });

        // Tim bay
        function createHearts() {
            const bg = document.getElementById('heartBg');
            setInterval(() => {
                const heart = document.createElement('i');
                heart.className = `floating-heart bi bi-heart-fill`;
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 8 + 10) + 's';
                bg.appendChild(heart);
                setTimeout(() => heart.remove(), 15000);
            }, 1000);
        }

        // Utils khác
        async function uploadSong() {
            const ten = document.getElementById('songTitle').value.trim();
            const file = document.getElementById('pdfFile').files[0];
            if (!ten || !file) return alert('Nhập tên nhen Oanh!');
            const fileName = `${Date.now()}_${file.name}`;
            const { data } = await _supabase.storage.from('pdfs').upload(fileName, file);
            if (data) {
                const { data: url } = _supabase.storage.from('pdfs').getPublicUrl(fileName);
                await _supabase.from('song').insert([{ ten_nhac: ten, pdf_url: url.publicUrl }]);
                location.reload();
            }
        }
        async function deleteSong(id, url) {
            if (!confirm('Xóa không?')) return;
            const fileName = url.split('/').pop();
            await _supabase.storage.from('pdfs').remove([fileName]);
            await _supabase.from('song').delete().eq('id', id);
            location.reload();
        }
        function updateFileName() { const input = document.getElementById('pdfFile'); if (input.files.length > 0) document.getElementById('fileLabel').innerHTML = input.files[0].name; }

        createHearts(); loadSongs();
        document.getElementById('daysCount').innerText = Math.ceil(Math.abs(new Date() - startDate) / (1000 * 60 * 60 * 24));
    </script>
</body>
</html>
