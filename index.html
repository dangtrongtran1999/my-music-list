<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kho Nhạc Của Oanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <h2 class="text-center mb-4">🎵 Danh Sách Nhạc Của Oanh</h2>

        <div class="card p-4 mb-4 shadow-sm">
            <h5>Thêm bài mới</h5>
            <div class="input-group mb-3">
                <input type="text" id="songTitle" class="form-control" placeholder="Tên bài hát...">
                <input type="file" id="pdfFile" class="form-control" accept=".pdf">
                <button class="btn btn-primary" onclick="uploadSong()">Tải lên</button>
            </div>
        </div>

        <div id="musicList" class="list-group shadow-sm">
        </div>
    </div>

    <script>
        const _supabase = supabase.createClient('https://vvmivjmgepmosdwkiagb.supabase.co', 'sb_publishable_f9No0YOA6vmNDJwdE_GG3w_gtKXbIcF');

        // 1. Load danh sách bài hát
        async function loadSongs() {
            const { data } = await _supabase.from('songs').select('*').order('created_at', { ascending: false });
            const list = document.getElementById('musicList');
            list.innerHTML = data.map(song => `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="${song.pdf_url}" target="_blank" class="text-decoration-none fw-bold">${song.title}</a>
                    <button class="btn btn-sm btn-danger" onclick="deleteSong(${song.id}, '${song.pdf_url}')">Xóa</button>
                </div>
            `).join('');
        }

        // 2. Upload PDF và lưu vào DB
        async function uploadSong() {
            const title = document.getElementById('songTitle').value;
            const file = document.getElementById('pdfFile').files[0];
            if (!title || !file) return alert('Nhập đủ tên và chọn file nhen!');

            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData } = await _supabase.storage.from('pdfs').upload(fileName, file);

            if (uploadData) {
                const { data: urlData } = _supabase.storage.from('pdfs').getPublicUrl(fileName);
                await _supabase.from('songs').insert([{ title, pdf_url: urlData.publicUrl }]);
                location.reload();
            }
        }

        // 3. Xóa bài hát
        async function deleteSong(id, url) {
            if (!confirm('Xóa thiệt hả Oanh?')) return;
            const fileName = url.split('/').pop();
            await _supabase.storage.from('pdfs').remove([fileName]);
            await _supabase.from('songs').delete().eq('id', id);
            location.reload();
        }

        loadSongs();
    </script>
</body>
</html>
