<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc Của Oanh 🎵</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary-pink: #ff4d6d;
            --hover-pink: #ff758f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- BACKGROUND ĐỘNG: TIM BAY --- */
        .heart-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-heart {
            position: absolute;
            color: rgba(255, 77, 109, 0.4);
            animation: float 15s linear infinite;
            bottom: -50px;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        /* --- FIX CHỮ TRONG ACCORDION SÁNG HƠN --- */
        .accordion-item {
            background: transparent;
            border: none;
        }

        .accordion-button {
            background: rgba(255,255,255,0.1);
            color: white !important;
            border-radius: 15px !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }

            .accordion-button:not(.collapsed) {
                background: rgba(255, 77, 109, 0.3);
                color: white !important;
                box-shadow: none;
            }

            .accordion-button::after {
                filter: brightness(0) invert(1);
            }

        .accordion-body h6 {
            color: var(--primary-pink) !important;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .accordion-body label {
            color: white !important;
            opacity: 1 !important;
        }

        .accordion-body .small {
            color: rgba(255,255,255,1) !important;
            font-weight: 500;
        }

        .form-control::placeholder {
            color: rgba(255,255,255,0.4) !important;
        }

        h2, .dating-title {
            font-family: 'Dancing Script', cursive;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 3.5rem;
            margin: 40px 0;
        }

        /* --- DATING COUNTER --- */
        .dating-container {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .avatar {
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            border: 3px solid white;
            object-fit: cover;
            transition: 0.5s;
        }

            .avatar:hover {
                transform: scale(1.1) rotate(5deg);
                border-color: var(--primary-pink);
            }

        .days-number {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            color: var(--primary-pink);
            line-height: 1;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: heartBeat 1.2s infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        /* --- MUSIC PLAYER --- */
        .music-player-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 50px !important;
            transition: 0.3s;
        }

        .play-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--primary-pink);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 0;
            overflow: hidden;
            transition: 0.5s;
        }

        .music-player-container:hover .volume-control {
            width: 120px;
        }

        #volumeSlider {
            width: 80px;
            accent-color: var(--primary-pink);
            cursor: pointer;
        }

        .playing {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 77, 109, 0.7);
            }

            70% {
                box-shadow: 0 0 0 15px rgba(255, 77, 109, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 77, 109, 0);
            }
        }

        /* --- PREVIEW PDF --- */
        #previewContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 15px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
        }

        .preview-item {
            position: relative;
            background: rgba(255,255,255,0.1);
            padding: 5px;
            border-radius: 10px;
            cursor: grab;
        }

            .preview-item img {
                width: 100%;
                height: 110px;
                object-fit: cover;
                border-radius: 5px;
            }

        .preview-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--primary-pink);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #444;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        .btn-upload {
            background: var(--primary-pink);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-convert {
            background: #00b4d8;
            border: none;
            font-weight: 600;
            color: white;
        }

        .custom-file-upload {
            display: block;
            padding: 7px 15px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            text-align: center;
            color: white;
        }

        .list-group-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 10px;
            border-radius: 15px !important;
            transition: 0.3s;
        }

            .list-group-item:hover {
                background: rgba(255, 255, 255, 0.15);
                transform: translateX(8px);
            }

        .song-link {
            color: white;
            text-decoration: none;
            flex-grow: 1;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="heart-bg" id="heartBg"></div>

    <div class="container">
        <h2 class="text-center">🎵 Kho Nhạc Của Oanh</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="accordion mb-4" id="toolAccordion">
                    <div class="accordion-item glass-card">
                        <h2 class="accordion-header">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTools">
                                <i class="bi bi-gear-fill me-2"></i> Công cụ quản lý nhạc
                            </button>
                        </h2>
                        <div id="collapseTools" class="accordion-collapse collapse" data-bs-parent="#toolAccordion">
                            <div class="accordion-body px-4">
                                <div class="mb-4">
                                    <h6><i class="bi bi-heart-fill me-2"></i>Thêm Giai Điệu Mới</h6>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-5"><input type="text" id="songTitle" class="form-control" placeholder="Tên bài hát..."></div>
                                        <div class="col-md-5">
                                            <label for="pdfFile" class="custom-file-upload" id="fileLabel"><i class="bi bi-file-earmark-pdf"></i> Chọn file PDF</label>
                                            <input type="file" id="pdfFile" accept=".pdf" onchange="updateFileName()">
                                        </div>
                                        <div class="col-md-2"><button class="btn btn-upload w-100 p-2" onclick="uploadSong()"><i class="bi bi-cloud-plus-fill"></i></button></div>
                                    </div>
                                </div>
                                <hr class="opacity-25">
                                <div>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <h6><i class="bi bi-magic me-2"></i>Gộp Ảnh sang PDF</h6>
                                        <button class="btn btn-sm btn-reset" onclick="resetAllImages()">Reset</button>
                                    </div>
                                    <div class="row g-2 align-items-center">
                                        <div class="col-md-9">
                                            <label for="imgToPdf" class="custom-file-upload" id="imgLabel"><i class="bi bi-images"></i> Chọn ảnh iPhone/Android</label>
                                            <input type="file" id="imgToPdf" accept="image/*,.heic,.HEIC" multiple onchange="handleFileSelect()">
                                        </div>
                                        <div class="col-md-3"><button id="btnConvert" class="btn btn-convert w-100 p-2" onclick="generatePDF()">Gộp Ngay</button></div>
                                    </div>
                                    <div id="previewContainer" style="display: none;"></div>
                                    <div id="pdfStatus" class="small mt-2 text-center"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-2 mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-white opacity-50"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-transparent border-0" placeholder="Tìm bài hát A-Z..." oninput="filterSongs()">
                    </div>
                </div>

                <div id="musicList" class="list-group mb-5">
                    <div class="text-center py-5"><div class="spinner-border text-light"></div></div>
                </div>

                <div class="glass-card p-5 text-center">
                    <h4 class="dating-title mb-4">Our Love Story</h4>
                    <div class="dating-container">
                        <div class="avatar-box">
                            <img src="dang.jpg" class="avatar" alt="Đăng">
                            <div class="avatar-name mt-2 fw-bold">Anh Đăng</div>
                        </div>
                        <div class="counter-box">
                            <div class="heart-icon"><i class="bi bi-heart-fill"></i></div>
                            <div id="daysCount" class="days-number">0</div>
                            <div style="font-size: 0.7rem; opacity: 0.8; font-weight: 600;">NGÀY BÊN NHAU</div>
                        </div>
                        <div class="avatar-box">
                            <img src="oanh.jpg" class="avatar" alt="Oanh">
                            <div class="avatar-name mt-2 fw-bold">Bé Oanh</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="music-player-container glass-card">
        <button id="playBtn" class="play-btn"><i class="bi bi-play-fill" id="playIcon"></i></button>
        <div class="volume-control">
            <i class="bi bi-volume-up-fill small text-white"></i>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
        </div>
        <audio id="bgMusic" loop>
            <source src="kisstherain.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        const _URL = 'https://vvmivjmgepmosdwkiagb.supabase.co';
        const _KEY = 'sb_publishable_f9No0YOA6vmNDJwdE_GG3w_gtKXbIcF';
        const _supabase = supabase.createClient(_URL, _KEY);
        const startDate = new Date('2024-05-21');

        // Logic Nhạc
        const bgMusic = document.getElementById('bgMusic');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const volumeSlider = document.getElementById('volumeSlider');

        playBtn.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().catch(e => console.log("Cần click để phát nhen!"));
                playIcon.classList.replace('bi-play-fill', 'bi-pause-fill');
                playBtn.classList.add('playing');
            } else {
                bgMusic.pause();
                playIcon.classList.replace('bi-pause-fill', 'bi-play-fill');
                playBtn.classList.remove('playing');
            }
        });
        volumeSlider.addEventListener('input', (e) => { bgMusic.volume = e.target.value; });

        // Hiệu ứng Tim
        function createHearts() {
            const bg = document.getElementById('heartBg');
            setInterval(() => {
                const heart = document.createElement('i');
                heart.className = `floating-heart bi bi-heart-fill`;
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
                heart.style.animationDuration = (Math.random() * 8 + 10) + 's';
                bg.appendChild(heart);
                setTimeout(() => heart.remove(), 15000);
            }, 1200);
        }

        // Supabase & Tool (Giữ nguyên logic A-Z và Gộp PDF)
        async function loadSongs() {
            const { data, error } = await _supabase.from('song').select('*').order('ten_nhac', { ascending: true });
            if (error) return;
            allSongs = data || [];
            renderList(allSongs);
        }

        function renderList(songs) {
            const list = document.getElementById('musicList');
            if (songs.length === 0) { list.innerHTML = `<div class="text-center opacity-50 mt-5">Chưa có bản nhạc nào... ❤️</div>`; return; }
            list.innerHTML = songs.map(song => `
                    <div class="list-group-item d-flex justify-content-between align-items-center">
                        <a href="${song.pdf_url}" target="_blank" class="song-link"><i class="bi bi-music-note-beamed me-2 text-danger"></i> ${song.ten_nhac}</a>
                        <i class="bi bi-trash3 delete-icon" onclick="deleteSong(${song.id}, '${song.pdf_url}')"></i>
                    </div>`).join('');
        }

        // (Các hàm uploadSong, deleteSong, generatePDF, handleFileSelect giữ nguyên như bản trước)
        // Đăng nhớ copy phần logic PDF từ code cũ nhen!

        createHearts(); loadSongs();
        const diff = Math.abs(new Date() - startDate);
        document.getElementById('daysCount').innerText = Math.ceil(diff / (1000 * 60 * 60 * 24));
    </script>
</body>
</html>
