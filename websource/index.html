<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc Của Oanh 🎵</title>

    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>

    <style>
        :root {
            --primary-pink: #ff4d6d;
            --hover-pink: #ff758f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h2, .dating-title {
            font-family: 'Dancing Script', cursive;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 3.5rem;
            margin: 40px 0;
        }

        /* --- PHẦN FIX: DATING CONTAINER --- */
        .dating-container {
            display: flex !important; /* Ép buộc dàn hàng ngang */
            flex-direction: row !important;
            align-items: center;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .avatar {
            width: 110px !important;
            height: 110px !important;
            border-radius: 50% !important;
            border: 3px solid white;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: 0.5s;
        }

            .avatar:hover {
                transform: scale(1.1) rotate(5deg);
                border-color: var(--primary-pink);
            }

        .avatar-name {
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: 600;
            opacity: 0.9;
        }

        .days-number {
            font-family: 'Dancing Script', cursive;
            font-size: 3.8rem;
            color: var(--primary-pink);
            line-height: 1;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: heartBeat 1.2s infinite;
            display: inline-block;
        }

        /* --- TOOL GỘP ẢNH --- */
        #previewContainer {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 15px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
        }

        .preview-item {
            position: relative;
            background: rgba(255,255,255,0.1);
            padding: 8px;
            border-radius: 12px;
            cursor: grab;
        }

            .preview-item img {
                width: 100%;
                height: 120px;
                object-fit: cover;
                border-radius: 8px;
            }

        .preview-badge {
            position: absolute;
            top: -5px;
            left: -5px;
            background: var(--primary-pink);
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: bold;
        }

        .remove-btn {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #444;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            border: 1px solid rgba(255,255,255,0.3);
        }

            .remove-btn:hover {
                background: #ff4d6d;
            }

        .file-name {
            font-size: 10px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            opacity: 0.7;
            margin: 5px 0 0 0;
        }

        /* --- STYLE KHÁC --- */
        @keyframes heartBeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.3);
            }
        }

        .btn-upload {
            background: var(--primary-pink);
            border: none;
            color: white;
            font-weight: 600;
        }

        .btn-convert {
            background: #00b4d8;
            border: none;
            font-weight: 600;
            color: white;
        }

        .btn-reset {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            font-size: 0.8rem;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        #pdfFile, #imgToPdf {
            display: none;
        }

        .custom-file-upload {
            display: block;
            padding: 7px 15px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            text-align: center;
        }

        .list-group-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            margin-bottom: 10px;
            border-radius: 15px !important;
        }

        .song-link {
            color: white;
            text-decoration: none;
            flex-grow: 1;
            font-weight: 500;
        }

        .delete-icon {
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">🎵 Kho Nhạc Của Oanh</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">

                <div class="glass-card p-4 mb-4">
                    <h5 class="mb-3"><i class="bi bi-heart-fill me-2 text-danger"></i>Thêm Giai Điệu Mới</h5>
                    <div class="row g-3 align-items-center">
                        <div class="col-md-5">
                            <input type="text" id="songTitle" class="form-control" placeholder="Tên bài hát...">
                        </div>
                        <div class="col-md-5">
                            <label for="pdfFile" class="custom-file-upload" id="fileLabel">
                                <i class="bi bi-file-earmark-pdf me-1"></i> Chọn nhạc PDF
                            </label>
                            <input type="file" id="pdfFile" accept=".pdf" onchange="updateFileName()">
                        </div>
                        <div class="col-md-2 text-end">
                            <button class="btn btn-upload w-100 p-2" onclick="uploadSong()">
                                <i class="bi bi-cloud-plus-fill"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="glass-card p-4 mb-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="m-0"><i class="bi bi-magic me-2 text-info"></i>Gộp Ảnh sang PDF</h5>
                        <button class="btn btn-sm btn-reset" onclick="resetAllImages()">
                            <i class="bi bi-arrow-counterclockwise"></i> Reset
                        </button>
                    </div>
                    <div class="row g-2 align-items-center">
                        <div class="col-md-9">
                            <label for="imgToPdf" class="custom-file-upload" id="imgLabel">
                                <i class="bi bi-images me-1"></i> Chọn ảnh (iPhone/Android)
                            </label>
                            <input type="file" id="imgToPdf" accept="image/*,.heic,.HEIC" multiple onchange="handleFileSelect()">
                        </div>
                        <div class="col-md-3">
                            <button id="btnConvert" class="btn btn-convert w-100 p-2" onclick="generatePDF()">
                                <i class="bi bi-file-earmark-pdf-fill"></i> Gộp Ngay
                            </button>
                        </div>
                    </div>
                    <div id="previewContainer" style="display: none;"></div>
                    <div id="pdfStatus" class="small mt-2 text-center opacity-75"></div>
                </div>

                <div class="glass-card p-2 mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-white opacity-50"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-transparent border-0" placeholder="Tìm bài hát..." oninput="filterSongs()">
                    </div>
                </div>

                <div id="musicList" class="list-group mb-5">
                    <div class="text-center py-5"><div class="spinner-border text-light"></div></div>
                </div>

                <div class="glass-card p-5">
                    <h4 class="text-center dating-title mb-4">Our Love Story</h4>
                    <div class="dating-container">
                        <div class="avatar-box text-center">
                            <img src="dang.jpg" class="avatar" alt="Anh Đăng">
                            <div class="avatar-name">Anh Đăng</div>
                        </div>

                        <div class="counter-box text-center">
                            <div class="heart-icon"><i class="bi bi-heart-fill"></i></div>
                            <div id="daysCount" class="days-number">0</div>
                            <div style="font-size: 0.7rem; opacity: 0.6; font-weight: 600; letter-spacing: 1px;">NGÀY BÊN NHAU</div>
                        </div>

                        <div class="avatar-box text-center">
                            <img src="oanh.jpg" class="avatar" alt="Bé Oanh">
                            <div class="avatar-name">Bé Oanh</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const _URL = 'https://vvmivjmgepmosdwkiagb.supabase.co';
        const _KEY = 'sb_publishable_f9No0YOA6vmNDJwdE_GG3w_gtKXbIcF';
        const _supabase = supabase.createClient(_URL, _KEY);
        const startDate = new Date('2024-05-21'); // Đăng chỉnh lại ngày nhen

        // Kéo thả
        const previewContainer = document.getElementById('previewContainer');
        const sortable = Sortable.create(previewContainer, {
            animation: 150,
            onEnd: updateBadges
        });

        function updateBadges() {
            const items = previewContainer.querySelectorAll('.preview-item');
            items.forEach((item, index) => { item.querySelector('.preview-badge').innerText = index + 1; });
            document.getElementById('imgLabel').innerHTML = `<i class="bi bi-check-all text-success"></i> Đã chọn ${items.length} ảnh`;
        }

        function handleFileSelect() {
            const input = document.getElementById('imgToPdf');
            const files = Array.from(input.files);
            if (files.length === 0) return;
            previewContainer.style.display = "grid";
            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            files.forEach((file) => {
                const item = document.createElement('div');
                item.className = 'preview-item';
                item.fileObject = file;
                let imgSrc = "https://placehold.co/100x120?text=HEIC";
                if (file.type !== "image/heic" && !file.name.toLowerCase().endsWith(".heic")) imgSrc = URL.createObjectURL(file);
                item.innerHTML = `<div class="preview-badge">0</div><div class="remove-btn" onclick="removeThisImage(this.parentElement)"><i class="bi bi-x"></i></div><img src="${imgSrc}"><p class="file-name">${file.name}</p>`;
                previewContainer.appendChild(item);
            });
            updateBadges();
            input.value = "";
        }

        function removeThisImage(el) { el.remove(); updateBadges(); if (previewContainer.children.length === 0) previewContainer.style.display = "none"; }
        function resetAllImages() { if (confirm("Reset nhen Oanh?")) { previewContainer.innerHTML = ""; previewContainer.style.display = "none"; } }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const btn = document.getElementById('btnConvert');
            const status = document.getElementById('pdfStatus');
            const items = Array.from(previewContainer.querySelectorAll('.preview-item'));
            if (items.length === 0) return alert('Chọn ảnh nhen Oanh! ❤️');
            btn.disabled = true; status.innerHTML = "Đang gộp nhạc... ⏳";
            const pdf = new jsPDF();
            try {
                for (let i = 0; i < items.length; i++) {
                    let file = items[i].fileObject;
                    if (file.type === "image/heic" || file.name.toLowerCase().endsWith(".heic")) {
                        const blob = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.7 });
                        file = Array.isArray(blob) ? blob[0] : blob;
                    }
                    const imgData = await new Promise(r => { const reader = new FileReader(); reader.onload = e => r(e.target.result); reader.readAsDataURL(file); });
                    if (i > 0) pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, 0, pdf.internal.pageSize.getWidth(), pdf.internal.pageSize.getHeight());
                }
                pdf.save(`Nhac_Oanh_${Date.now()}.pdf`);
                status.innerHTML = "✅ Xong rồi nhen!";
            } catch (e) { alert("Lỗi rồi Đăng ơi!"); } finally { btn.disabled = false; }
        }

        function calculateDatingDays() {
            const diff = Math.abs(new Date() - startDate);
            document.getElementById('daysCount').innerText = Math.ceil(diff / (1000 * 60 * 60 * 24));
        }

        function updateFileName() {
            const input = document.getElementById('pdfFile');
            if (input.files.length > 0) document.getElementById('fileLabel').innerHTML = `<i class="bi bi-check2-circle text-success"></i> ${input.files[0].name}`;
        }

        async function loadSongs() {
            const { data, error } = await _supabase.from('song').select('*').order('ngay_tao', { ascending: false });
            if (error) return;
            allSongs = data || [];
            renderList(allSongs);
        }

        function renderList(songs) {
            const list = document.getElementById('musicList');
            if (songs.length === 0) { list.innerHTML = `<div class="text-center opacity-50 mt-5">Chưa có bản nhạc nào... ❤️</div>`; return; }
            list.innerHTML = songs.map(song => `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="${song.pdf_url}" target="_blank" class="song-link"><i class="bi bi-music-note-beamed me-2 text-danger"></i> ${song.ten_nhac}</a>
                    <i class="bi bi-trash3 delete-icon" onclick="deleteSong(${song.id}, '${song.pdf_url}')"></i>
                </div>`).join('');
        }

        function filterSongs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderList(allSongs.filter(s => s.ten_nhac.toLowerCase().includes(query)));
        }

        async function uploadSong() {
            const ten_nhac = document.getElementById('songTitle').value;
            const file = document.getElementById('pdfFile').files[0];
            const btn = document.querySelector('.btn-upload');
            if (!ten_nhac || !file) return alert('Nhập tên nhen Oanh! ❤️');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>'; btn.disabled = true;
            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData } = await _supabase.storage.from('pdfs').upload(fileName, file);
            if (uploadData) {
                const { data: urlData } = _supabase.storage.from('pdfs').getPublicUrl(fileName);
                await _supabase.from('song').insert([{ ten_nhac: ten_nhac, pdf_url: urlData.publicUrl }]);
                location.reload();
            } else { btn.disabled = false; btn.innerHTML = '<i class="bi bi-cloud-plus-fill"></i>'; }
        }

        async function deleteSong(id, url) {
            if (!confirm('Xóa bản nhạc này không bé yêu? 🥺')) return;
            const fileName = url.split('/').pop();
            await _supabase.storage.from('pdfs').remove([fileName]);
            await _supabase.from('song').delete().eq('id', id);
            location.reload();
        }

        loadSongs(); calculateDatingDays();
    </script>
</body>
</html>
