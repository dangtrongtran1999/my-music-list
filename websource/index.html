<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kho Nhạc Của Oanh 🎵</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-pink: #ff4d6d;
            --hover-pink: #ff758f;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
            padding-bottom: 80px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        h2, .dating-title {
            font-family: 'Dancing Script', cursive;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        h2 {
            font-size: 3.5rem;
            margin: 40px 0;
        }

        /* Dating Counter Styles */
        .dating-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .avatar-box {
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid white;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
            transition: 0.5s;
        }

            .avatar:hover {
                transform: scale(1.1) rotate(5deg);
                border-color: var(--primary-pink);
            }

        .avatar-name {
            font-size: 0.9rem;
            margin-top: 10px;
            font-weight: 600;
            opacity: 0.8;
        }

        .counter-box {
            text-align: center;
        }

        .days-number {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: var(--primary-pink);
            line-height: 1;
        }

        .days-text {
            font-size: 1rem;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .heart-icon {
            color: #ff4d6d;
            font-size: 1.5rem;
            animation: heartBeat 1.2s infinite;
            display: inline-block;
        }

        @keyframes heartBeat {
            0% {
                transform: scale(1);
            }

            14% {
                transform: scale(1.3);
            }

            28% {
                transform: scale(1);
            }

            42% {
                transform: scale(1.3);
            }

            70% {
                transform: scale(1);
            }
        }

        /* Form & List Styles */
        .form-control {
            background: rgba(255, 255, 255, 0.1) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            color: white !important;
        }

        .btn-upload {
            background: var(--primary-pink);
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

            .btn-upload:hover {
                background: var(--hover-pink);
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
            }

        #pdfFile {
            display: none;
        }

        .custom-file-upload {
            display: block;
            padding: 7px 15px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            border: 1px dashed rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            text-align: center;
            transition: 0.3s;
        }

        .list-group-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: 0.3s;
            margin-bottom: 10px;
            border-radius: 15px !important;
        }

            .list-group-item:hover {
                background: rgba(255, 255, 255, 0.18);
                transform: translateX(10px);
            }

        .song-link {
            color: white;
            text-decoration: none;
            flex-grow: 1;
        }

        .delete-icon {
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: 0.3s;
        }

            .delete-icon:hover {
                color: #ff4d6d;
            }
    </style>
</head>
<body>

    <div class="container">
        <h2 class="text-center">🎵 Kho Nhạc Của Oanh</h2>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card p-4 mb-4">
                    <h5 class="mb-3"><i class="bi bi-heart-fill me-2 text-danger"></i>Thêm Giai Điệu Mới</h5>
                    <div class="row g-3">
                        <div class="col-md-5"><input type="text" id="songTitle" class="form-control" placeholder="Tên bài hát..."></div>
                        <div class="col-md-5">
                            <label for="pdfFile" class="custom-file-upload" id="fileLabel"><i class="bi bi-file-earmark-pdf me-1"></i> Chọn nhạc PDF</label>
                            <input type="file" id="pdfFile" accept=".pdf" onchange="updateFileName()">
                        </div>
                        <div class="col-md-2 text-end"><button class="btn btn-upload w-100 text-white" onclick="uploadSong()"><i class="bi bi-cloud-plus"></i></button></div>
                    </div>
                </div>

                <div class="glass-card p-2 mb-4">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 text-white opacity-50"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control bg-transparent border-0" placeholder="Tìm bài hát của Oanh..." oninput="filtersong()">
                    </div>
                </div>

                <div id="musicList" class="list-group mb-5">
                    <div class="text-center py-5"><div class="spinner-border text-light"></div></div>
                </div>

                <hr class="opacity-25 my-5">

                <div class="glass-card p-5">
                    <h4 class="text-center dating-title mb-4">Our Love Story</h4>
                    <div class="dating-container">
                        <div class="avatar-box">
                            <img src="dang.jpg" class="avatar" alt="Đăng">
                            <div class="avatar-name">Trọng Đăng</div>
                        </div>

                        <div class="counter-box">
                            <div class="heart-icon"><i class="bi bi-heart-fill"></i></div>
                            <div id="daysCount" class="days-number">0</div>
                            <div class="days-text">Ngày bên nhau</div>
                        </div>

                        <div class="avatar-box">
                            <img src="oanh.jpg" class="avatar" alt="Oanh">
                            <div class="avatar-name">Hoàng Oanh</div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // CẤU HÌNH SUPABASE
        const _supabase = supabase.createClient('https://vvmivjmgepmosdwkiagb.supabase.co', 'sb_publishable_f9No0YOA6vmNDJwdE_GG3w_gtKXbIcF');

        // NGÀY BẮT ĐẦU QUEN (Đăng sửa ở đây nhen)
        const startDate = new Date('2024-05-21'); // Định dạng: YYYY-MM-DD

        function calculateDatingDays() {
            const now = new Date();
            const diffTime = Math.abs(now - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').innerText = diffDays;
        }

        let allsong = [];

        function updateFileName() {
            const fileInput = document.getElementById('pdfFile');
            const fileLabel = document.getElementById('fileLabel');
            if (fileInput.files.length > 0) {
                fileLabel.innerHTML = `<i class="bi bi-check2-circle text-success"></i> ${fileInput.files[0].name}`;
            }
        }

        async function loadsong() {
            const { data } = await _supabase.from('song').select('*').order('created_at', { ascending: false });
            allsong = data || [];
            renderList(allsong);
        }

        function renderList(song) {
            const list = document.getElementById('musicList');
            if (song.length === 0) { list.innerHTML = `<div class="text-center opacity-50 mt-5">Chưa có bản nhạc nào hết á...</div>`; return; }
            list.innerHTML = song.map(song => `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="${song.pdf_url}" target="_blank" class="song-link"><i class="bi bi-music-note-beamed me-2 text-danger"></i> ${song.title}</a>
                    <i class="bi bi-trash3 delete-icon" onclick="deleteSong(${song.id}, '${song.pdf_url}')"></i>
                </div>
            `).join('');
        }

        function filtersong() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            renderList(allsong.filter(s => s.title.toLowerCase().includes(query)));
        }

        async function uploadSong() {
            const title = document.getElementById('songTitle').value;
            const file = document.getElementById('pdfFile').files[0];
            const btn = document.querySelector('.btn-upload');
            if (!title || !file) return alert('Nhập đủ thông tin nhen! ❤️');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            const fileName = `${Date.now()}_${file.name}`;
            const { data: uploadData } = await _supabase.storage.from('pdfs').upload(fileName, file);
            if (uploadData) {
                const { data: urlData } = _supabase.storage.from('pdfs').getPublicUrl(fileName);
                await _supabase.from('song').insert([{ title, pdf_url: urlData.publicUrl }]);
                location.reload();
            }
        }

        async function deleteSong(id, url) {
            if (!confirm('Xóa bản nhạc này không bé yêu? 🥺')) return;
            const fileName = url.split('/').pop();
            await _supabase.storage.from('pdfs').remove([fileName]);
            await _supabase.from('song').delete().eq('id', id);
            location.reload();
        }

        // Khởi chạy
        loadsong();
        calculateDatingDays();
    </script>
</body>
</html>
